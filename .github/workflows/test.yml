name: Test editor plugins

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci --ignore-scripts
      - run: npm run check:claude
      - name: Validate Claude package with the native client
        run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate ./plugins/claude
      - name: Validate Claude marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate .
      - run: npm run check:mcp
      - name: Verify vendored read contract against pinned public source
        run: node scripts/check-read-contract.mjs --upstream
      - run: npm test
